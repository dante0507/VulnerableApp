# sonar-project.properties
# Configuración para el análisis de SonarQube

# Identificador único del proyecto
sonar.projectKey=VulnerableApp
sonar.projectName=VulnerableApp
sonar.projectVersion=1.0

# Directorio del código fuente
sonar.sources=.
sonar.exclusions=**/results/**,**/db/**,**/codeSql/**,**/docker/**,**/scripts/**,**/tests/**,**/__pycache__/**,**/*.sarif,**/*.zip

# Incluir solo los archivos relevantes
sonar.inclusions=src/vulnerable/*.py,src/secure/*.py

# Lenguaje Python
sonar.language=py

# Fuente de codificación
sonar.sourceEncoding=UTF-8

# Configuración de Python
sonar.python.version=3.8,3.9,3.10,3.11

# Activar análisis de seguridad
sonar.security.enabled=true
sonar.security.audit.enabled=true